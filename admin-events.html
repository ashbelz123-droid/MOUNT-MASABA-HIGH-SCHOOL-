<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Events Manager — Admin</title><link rel="stylesheet" href="./css/styles.css"><link rel="stylesheet" href="./css/components.css"><link rel="stylesheet" href="./css/portals.css"></head><body class="portal-shell"><header class="portal-topbar"><div class="portal-topbar-inner"><a class="portal-brand" href="./admin-dashboard.html"><img src="./assets/logo.png" alt="School logo"><span class="portal-brand-text">Mount Masaba<br><small>Events Manager</small></span></a><div class="portal-user"><a class="btn btn-secondary btn-sm" href="./admin-dashboard.html">Dashboard</a><button class="btn btn-primary btn-sm" id="logoutBtn">Logout</button></div></div></header><main class="portal-main" style="max-width:1100px;margin:auto"><div class="portal-page-head"><div><h1>Events Manager</h1><p>Create, edit and publish school events and important dates.</p></div></div><section class="portal-card"><div class="portal-card-head"><h2 id="editorTitle">Create event</h2><button class="btn btn-secondary btn-sm" id="cancelEdit" type="button" hidden>Cancel</button></div><form id="eventForm"><input id="eventId" type="hidden"><div class="grid grid-2"><label>Event title<input id="title" maxlength="180" required></label><label>Category<select id="category"><option>Academic</option><option>Sports</option><option>School Event</option><option>Admissions</option><option>Meeting</option><option>Holiday</option><option>Other</option></select></label><label>Event date<input id="event_date" type="date" required></label><label>Start time<input id="start_time" type="time"></label><label>End time<input id="end_time" type="time"></label><label>Venue<input id="venue" maxlength="180"></label></div><label>Description<textarea id="description" rows="6"></textarea></label><label>Image URL<input id="image_url" type="url" placeholder="Optional Supabase media URL"></label><label class="check-row"><input id="published" type="checkbox" checked> Publish this event</label><button class="btn btn-primary" id="saveBtn">Save event</button><p id="formStatus" class="muted"></p></form></section><section class="portal-card" style="margin-top:15px"><div class="portal-card-head"><h2>Event calendar</h2><button class="btn btn-secondary btn-sm" id="refreshBtn" type="button">Refresh</button></div><div id="eventList" class="announcement-list"><div class="empty-state">Loading…</div></div></section></main><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="./supabase-client.js"></script><script src="./js/admin-guard.js"></script><script src="./js/admin-events.js"></script></body></html>
