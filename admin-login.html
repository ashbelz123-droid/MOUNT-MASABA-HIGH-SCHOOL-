<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login - Mount Masaba</title>
  <style>
    body { font-family: Arial; margin: 0; background: #003366; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .login-box { background: white; padding: 30px; border-radius: 10px; width: 350px; box-shadow: 0 0 20px rgba(0,0,0,0.3); }
    h2 { color: #003366; text-align: center; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #003366; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
    button:hover { background: #002244; }
    .note { font-size: 12px; color: #666; text-align: center; margin-top: 15px; }
    .back { text-align: center; margin-top: 15px; }
    .back a { color: #003366; text-decoration: none; }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>ADMIN LOGIN</h2>
    <form onsubmit="login(event)">
      <input type="email" id="email" placeholder="Admin Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">LOGIN</button>
    </form>
    <p class="note">For Admin use only. Public cannot register.</p>
    <div class="back">
      <a href="index.html">← Back to Home</a>
    </div>
  </div>

  <script>
    function login(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      // DEMO LOGIN - Works without Supabase for now
      if(email === "admin@school.com" && password === "password123") {
        alert("Login Successful! Redirecting to Dashboard...");
        window.location.href = "admin-dashboard.html";
      } else {
        alert("Wrong Email or Password. Use: admin@school.com / password123");
      }
    }
  </script>

</body>
</html>
