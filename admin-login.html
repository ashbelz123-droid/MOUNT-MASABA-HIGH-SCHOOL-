<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3158"><title>Admin Login | Mount Masaba High School</title><link rel="icon" href="./assets/logo.svg"><link rel="stylesheet" href="./css/styles.css"><link rel="stylesheet" href="./css/components.css"><link rel="stylesheet" href="./css/portals.css"><style>body{background:linear-gradient(135deg,#f5faff,#fffdf7)}.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(100%,460px);background:#fff;border:1px solid #dce8f2;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(11,49,88,.10)}.auth-brand{text-align:center}.auth-brand img{width:76px;height:76px;object-fit:contain}.auth-brand h1{margin:12px 0 4px;color:#0b3158}.auth-brand p{margin:0 0 24px;color:#708397}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:13px;font-weight:700;color:#425c72}.field input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #cfdeea;border-radius:11px;background:#fbfdff;font:inherit}.auth-row{display:flex;justify-content:space-between;gap:12px;margin:4px 0 16px}.auth-row a,.back{color:#0b5a91;text-decoration:none;font-size:13px}.error{color:#a52828;background:#fff1f1;padding:10px;border-radius:10px;font-size:13px;display:none}.note{font-size:12px;color:#708397;text-align:center;margin:16px 0}.back{display:block;text-align:center;margin-top:14px}</style></head><body><main class="auth-wrap"><section class="auth-card"><div class="auth-brand"><img src="./assets/logo.svg" alt="Mount Masaba High School crest"><h1>Administration</h1><p>Mount Masaba High School</p></div><form id="loginForm"><div class="field"><label for="email">Administrator email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><div class="auth-row"><a href="./admin-register.html">Create admin account</a><a href="#" id="resetLink">Forgot password?</a></div><button class="btn btn-primary btn-block" id="loginBtn">Sign in securely</button><p id="error" class="error"></p></form><p class="note">Admin access is restricted. Authentication alone does not grant administrative privileges.</p><a class="back" href="./index.html">← Back to Mount Masaba website</a></section></main><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="./supabase-client.js"></script><script>const sb=window.sb||window.supabaseClient;const f=document.getElementById('loginForm'),err=document.getElementById('error'),btn=document.getElementById('loginBtn');function show(t,good=false){err.textContent=t;err.style.display='block';err.style.color=good?'#17613a':'#a52828';err.style.background=good?'#eefaf3':'#fff1f1'}f.addEventListener('submit',async e=>{e.preventDefault();err.style.display='none';btn.disabled=true;btn.textContent='Verifying…';try{if(!sb)throw new Error('Supabase connection is not available.');const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;const u=r.data.user;const a=await sb.from('admins').select('id,role,active').eq('id',u.id).maybeSingle();if(a.error)throw new Error('Unable to verify administrator access.');if(!a.data||a.data.active===false){await sb.auth.signOut();throw new Error('Your account is not an approved administrator. Contact the school administrator.')}location.href='./admin-dashboard.html'}catch(e){show(e.message||'Unable to sign in.')}finally{btn.disabled=false;btn.textContent='Sign in securely'}});document.getElementById('resetLink').addEventListener('click',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim();if(!email)return show('Enter your administrator email first.');if(!sb)return show('Supabase connection is not available.');const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/admin-login.html'});if(r.error)return show(r.error.message);show('Password reset instructions have been sent if the account exists.',true)});</script></body></html>
