<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media Manager — Mount Masaba</title><link rel="stylesheet" href="./css/styles.css"><link rel="stylesheet" href="./css/components.css"><link rel="stylesheet" href="./css/portals.css"></head><body class="portal-shell"><header class="portal-topbar"><div class="portal-topbar-inner"><a class="portal-brand" href="./admin-dashboard.html"><img src="./assets/logo.png" alt="School logo"><span class="portal-brand-text">Mount Masaba<br><small>Media Manager</small></span></a><div class="portal-user"><a class="btn btn-secondary btn-sm" href="./admin-dashboard.html">Dashboard</a></div></div></header><main class="portal-main" style="max-width:1100px;margin:auto"><div class="portal-page-head"><div><h1>School Media</h1><p>Upload photos and videos once. They can then be reused across the school app.</p></div></div><section class="portal-card"><div class="portal-card-head"><h2>Upload media</h2><span class="chip">Supabase Storage</span></div><form id="mediaForm"><div class="grid grid-2"><label>Media type<select id="mediaType" required><option value="logo">School logo</option><option value="background">Campus background</option><option value="gallery">Gallery photo</option><option value="video">School video</option><option value="news">News image</option></select></label><label>Title<input id="mediaTitle" maxlength="120" placeholder="Optional title"></label></div><label>File<input id="mediaFile" type="file" accept="image/*,video/*" required></label><p class="muted">Large photos are optimized before upload when the image optimizer is available. Videos remain videos.</p><button class="btn btn-primary" type="submit" id="uploadBtn">Upload file</button></form><div id="uploadStatus" class="empty-state" hidden></div></section><section class="portal-card" style="margin-top:15px"><div class="portal-card-head"><h2>Uploaded media</h2><button class="btn btn-secondary btn-sm" id="refreshBtn" type="button">Refresh</button></div><div id="mediaGrid" class="grid grid-3"><div class="empty-state">Loading media…</div></div></section></main><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="./supabase-client.js"></script><script src="./js/supabase.js"></script><script src="./js/admin-media.js"></script></body></html>
