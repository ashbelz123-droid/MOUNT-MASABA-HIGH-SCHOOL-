<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>News Manager — Admin</title><link rel="stylesheet" href="./css/styles.css"><link rel="stylesheet" href="./css/components.css"><link rel="stylesheet" href="./css/portals.css"></head><body class="portal-shell"><header class="portal-topbar"><div class="portal-topbar-inner"><a class="portal-brand" href="./admin-dashboard.html"><img src="./assets/logo.png" alt="School logo"><span class="portal-brand-text">Mount Masaba<br><small>News Manager</small></span></a><div class="portal-user"><a class="btn btn-secondary btn-sm" href="./admin-dashboard.html">Dashboard</a><button class="btn btn-primary btn-sm" id="logoutBtn">Logout</button></div></div></header><main class="portal-main" style="max-width:1100px;margin:auto"><div class="portal-page-head"><div><h1>News Manager</h1><p>Create and publish school announcements, stories and updates.</p></div><button class="btn btn-primary" id="newBtn">+ New Story</button></div><section class="portal-card" id="editorCard" hidden><div class="portal-card-head"><h2 id="editorTitle">New Story</h2></div><form id="newsForm"><input id="newsId" type="hidden"><div class="grid grid-2"><label>Headline<input id="title" maxlength="180" required></label><label>Category<select id="category"><option>School News</option><option>Academics</option><option>Sports</option><option>Events</option><option>Admissions</option><option>Announcements</option></select></label></div><label>Summary<textarea id="summary" rows="3" maxlength="500"></textarea></label><label>Article<textarea id="content" rows="10" required></textarea></label><div class="grid grid-2"><label>Image URL<input id="image_url" type="url" placeholder="Use a URL from Media Manager"></label><label>Publish date<input id="published_at" type="datetime-local"></label></div><label><input id="published" type="checkbox" checked> Publish this story</label><div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button><button class="btn btn-primary" id="saveBtn">Save story</button></div><p id="formStatus" class="muted"></p></form></section><section class="portal-card" style="margin-top:15px"><div class="portal-card-head"><h2>Stories</h2><button class="btn btn-secondary btn-sm" id="refreshBtn">Refresh</button></div><div id="newsList" class="announcement-list"><div class="empty-state">Loading…</div></div></section></main><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="./supabase-client.js"></script><script src="./js/admin-guard.js"></script><script src="./js/admin-news.js"></script></body></html>
