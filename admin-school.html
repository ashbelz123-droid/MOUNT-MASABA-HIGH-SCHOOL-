<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Information — Admin</title><link rel="stylesheet" href="./css/styles.css"><link rel="stylesheet" href="./css/components.css"><link rel="stylesheet" href="./css/portals.css"></head><body class="portal-shell"><header class="portal-topbar"><div class="portal-topbar-inner"><a class="portal-brand" href="./admin-dashboard.html"><img src="./assets/logo.png" alt="School logo"><span class="portal-brand-text">Mount Masaba<br><small>School Information</small></span></a><div class="portal-user"><a class="btn btn-secondary btn-sm" href="./admin-dashboard.html">Dashboard</a><button class="btn btn-primary btn-sm" id="logoutBtn">Logout</button></div></div></header><main class="portal-main" style="max-width:1000px;margin:auto"><div class="portal-page-head"><div><h1>School Information</h1><p>Edit information shown across the public Mount Masaba website.</p></div></div><form id="schoolForm"><section class="portal-card"><div class="portal-card-head"><h2>Identity</h2><span class="chip">Public website</span></div><div class="grid grid-2"><label>School name<input id="school_name" maxlength="160" required></label><label>Motto<input id="motto" maxlength="160"></label><label>Short description<textarea id="description" rows="4"></textarea></label><label>About school<textarea id="about" rows="4"></textarea></label></div></section><section class="portal-card" style="margin-top:15px"><div class="portal-card-head"><h2>Contact & location</h2></div><div class="grid grid-2"><label>Address<input id="address"></label><label>City / District<input id="city"></label><label>Phone<input id="phone"></label><label>Email<input id="email" type="email"></label><label>Website<input id="website" type="url"></label><label>Map URL<input id="map_url" type="url"></label></div></section><section class="portal-card" style="margin-top:15px"><div class="portal-card-head"><h2>Admissions</h2></div><div class="grid grid-2"><label>Admissions status<select id="admissions_status"><option>Open</option><option>Closed</option><option>Coming Soon</option></select></label><label>Established year<input id="established" type="number" min="1800" max="2100"></label><label>Admissions message<textarea id="admissions_message" rows="4"></textarea></label><label>Office hours<textarea id="office_hours" rows="4"></textarea></label></div></section><section class="portal-card" style="margin-top:15px"><div class="portal-card-head"><h2>Public display</h2></div><div class="grid grid-2"><label>Logo URL<input id="logo_url" type="url"></label><label>Campus background URL<input id="background_url" type="url"></label></div><p class="muted">Upload files through Media Manager, then use their public URLs here.</p></section><div style="display:flex;justify-content:flex-end;margin:15px 0 40px"><button class="btn btn-primary" id="saveBtn">Save school information</button></div><p id="formStatus" class="muted" style="text-align:center"></p></form></main><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="./supabase-client.js"></script><script src="./js/admin-guard.js"></script><script src="./js/admin-school.js"></script></body></html>
