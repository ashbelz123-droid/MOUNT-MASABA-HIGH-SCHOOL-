<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Information — Admin</title><link rel="stylesheet" href="./css/styles.css"><link rel="stylesheet" href="./css/components.css"><link rel="stylesheet" href="./css/portals.css"></head><body class="portal-shell"><header class="portal-topbar"><div class="portal-topbar-inner"><a class="portal-brand" href="./admin-dashboard.html"><img src="./assets/logo.png" alt="School logo"><span class="portal-brand-text">Mount Masaba<br><small>School Information</small></span></a><div class="portal-user"><a class="btn btn-secondary btn-sm" href="./admin-dashboard.html">Dashboard</a><button class="btn btn-primary btn-sm" id="logoutBtn">Logout</button></div></div></header><main class="portal-main" style="max-width:1000px;margin:auto"><div class="portal-page-head"><div><h1>School Information</h1><p>Edit the information stored in the Mount Masaba school settings.</p></div></div><form id="schoolForm"><section class="portal-card"><div class="portal-card-head"><h2>School identity</h2><span class="chip">Supabase</span></div><div class="grid grid-2"><label>School name<input id="school_name" maxlength="160" value="Mount Masaba High School" required></label><label>Admission status<select id="admission_status"><option value="open">Open</option><option value="closed">Closed</option><option value="coming_soon">Coming Soon</option></select></label></div></section><section class="portal-card" style="margin-top:15px"><div class="portal-card-head"><h2>Contact & location</h2></div><div class="grid grid-2"><label>Phone numbers <small>(comma separated)</small><input id="phone_numbers"></label><label>Email<input id="email" type="email"></label><label>Address<input id="address"></label><label>Office hours<input id="office_hours"></label></div></section><section class="portal-card" style="margin-top:15px"><div class="portal-card-head"><h2>Branding & media</h2></div><div class="grid grid-2"><label>School logo URL<input id="logo_url" type="url"></label><label>Hero / campus image URL<input id="hero_image_url" type="url"></label><label>Login background URL<input id="login_bg_url" type="url"></label><label>Favicon URL<input id="favicon_url" type="url"></label></div><p class="muted">Upload media through the Media Manager, then paste the public URL here.</p></section><div style="display:flex;justify-content:flex-end;margin:15px 0 40px"><button class="btn btn-primary" id="saveBtn">Save school information</button></div><p id="formStatus" class="muted" style="text-align:center"></p></form></main><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="./supabase-client.js"></script><script src="./js/admin-guard.js"></script><script src="./js/admin-school.js"></script></body></html>
