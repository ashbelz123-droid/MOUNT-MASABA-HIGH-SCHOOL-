<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1557a6"><title>Gallery — Mount Masaba High School</title><link rel="stylesheet" href="./css/styles.css"><link rel="stylesheet" href="./css/components.css"><link rel="stylesheet" href="./css/pages.css"></head><body><header class="site-header"><div class="nav-row"><a href="./index.html" class="brand"><img id="schoolLogo" src="./assets/logo.png" alt="School logo"><span class="brand-name" id="schoolName">Mount Masaba<br>High School</span></a><nav class="nav-links"><a href="./index.html">Home</a><a href="./about.html">About</a><a href="./academics.html">Academics</a><a href="./admissions.html">Admissions</a><a href="./news.html">News</a><a class="active" href="./gallery.html">Gallery</a><a href="./contact.html">Contact</a></nav><button class="nav-toggle" aria-label="Menu">☰</button></div></header><main><section class="page-hero"><div class="container"><span class="eyebrow">Life at Mount Masaba</span><h1>School Gallery</h1><p>Explore moments, activities and memories from our school community.</p></div></section><section class="section"><div class="container"><div id="galleryGrid" class="gallery-grid"><div class="card"><p>Loading gallery…</p></div></div></div></section></main><footer class="site-footer"><div class="container"><div class="footer-bottom"><span>© <span class="year"></span> Mount Masaba High School. All rights reserved.</span></div></div></footer><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="./supabase-client.js"></script><script src="./js/supabase.js"></script><script src="./js/main.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const d=window.MountMasabaData;if(!d)return;const [s,items]=await Promise.all([d.settings(),d.gallery({limit:60})]);if(s){if(s.logo_url)document.getElementById('schoolLogo').src=s.logo_url;if(s.school_name)document.getElementById('schoolName').textContent=s.school_name}const host=document.getElementById('galleryGrid');host.innerHTML=items.length?items.map(x=>`<figure class="gallery-item"><img loading="lazy" src="${d.escapeHtml(x.image_url||x.media_url||'')}" alt="${d.escapeHtml(x.title||'Mount Masaba High School')}" onclick="this.closest('figure').classList.toggle('expanded')"><figcaption>${d.escapeHtml(x.title||'')}</figcaption></figure>`).join(''):'<div class="card"><p>No gallery photos have been published yet.</p></div>'})</script></body></html>
