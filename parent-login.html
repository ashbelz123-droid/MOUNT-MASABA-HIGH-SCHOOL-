<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1557a6"><title>Parent Login | Mount Masaba High School</title><link rel="icon" href="./assets/logo.svg"><link rel="stylesheet" href="./css/styles.css"></head><body><main class="auth-page"><section class="auth-card"><a class="auth-brand" href="./index.html"><img src="./assets/logo.svg" alt="Mount Masaba High School crest"><div><strong>Mount Masaba High School</strong><span>Parent Portal</span></div></a><div class="auth-intro"><span class="eyebrow">Parent access</span><h1>Parent login</h1><p>Sign in to follow your child's school information, communication and updates.</p></div><form id="loginForm" novalidate><label>Email address<input id="email" type="email" autocomplete="username" placeholder="parent email" required></label><label>Password<div class="password-wrap"><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button type="button" id="toggle">Show</button></div></label><p id="message" class="auth-message" hidden></p><button class="btn btn-accent btn-block" id="submit" type="submit">Sign in to Parent Portal</button></form><div class="secure-note">🔒 Parent accounts are issued or approved by Mount Masaba High School administration.</div><div class="portal-links"><a href="./student-login.html">Student login →</a><a href="./index.html">← Back to school website</a></div></section></main><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="./supabase-client.js"></script><script>const f=document.getElementById('loginForm'),m=document.getElementById('message'),b=document.getElementById('submit'),p=document.getElementById('password');document.getElementById('toggle').onclick=()=>{p.type=p.type==='password'?'text':'password';document.getElementById('toggle').textContent=p.type==='password'?'Show':'Hide'};f.onsubmit=async e=>{e.preventDefault();m.hidden=false;m.className='auth-message info';m.textContent='Signing in…';b.disabled=true;try{const{data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:p.value});if(error)throw error;m.className='auth-message success';m.textContent='Signed in successfully. Parent portal access is being prepared.';setTimeout(()=>location.href='./parent-portal.html',500)}catch(err){m.className='auth-message error';m.textContent=err.message||'Unable to sign in.'}finally{b.disabled=false}}</script></body></html>
