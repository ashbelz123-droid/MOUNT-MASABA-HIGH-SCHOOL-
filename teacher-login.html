<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1557a6"><meta name="description" content="Secure Mount Masaba High School teacher sign in"><title>Teacher Sign In | Mount Masaba High School</title><link rel="icon" href="./assets/logo.svg"><link rel="stylesheet" href="./css/styles.css"><link rel="stylesheet" href="./css/auth.css"></head><body><main class="auth-page"><section class="auth-card"><a class="auth-brand" href="./index.html"><img src="./assets/logo.svg" alt="Mount Masaba High School logo"><div><strong>Mount Masaba High School</strong><span>Teacher Portal</span></div></a><div class="auth-intro"><span class="eyebrow">Private staff access</span><h1>Teacher sign in</h1><p>Sign in with the teacher account created and approved by school administration.</p></div><form id="teacherLoginForm" novalidate><label>Email address<input id="email" name="email" type="email" autocomplete="username" placeholder="teacher@school.ac.ug" required></label><label>Password<div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required minlength="6"><button type="button" id="togglePassword">Show</button></div></label><p id="loginMessage" class="auth-message" role="alert" hidden></p><button class="btn btn-primary btn-block" type="submit" id="loginButton">Sign in to Teacher Portal</button></form><div class="secure-note">🔒 Private teacher access. Teacher accounts are controlled by school administration.</div><div class="portal-links"><a href="./student-login.html">Student login →</a><a href="./parent-login.html">Parent login →</a><a href="./index.html">← Back to school website</a></div></section></main><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="./supabase-client.js"></script><script>const form=document.getElementById('teacherLoginForm'),password=document.getElementById('password'),toggle=document.getElementById('togglePassword'),message=document.getElementById('loginMessage'),button=document.getElementById('loginButton');toggle.onclick=()=>{const show=password.type==='password';password.type=show?'text':'password';toggle.textContent=show?'Hide':'Show'};form.onsubmit=async e=>{e.preventDefault();message.hidden=false;message.className='auth-message info';message.textContent='Signing in…';button.disabled=true;try{const{data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:password.value});if(error)throw error;const user=data.user;let approved=false;try{const{data:teacher,error:teacherError}=await sb.from('teachers').select('id,status,approved,is_approved,email').eq('email',user.email).maybeSingle();if(!teacherError&&teacher){approved=teacher.status==='approved'||teacher.approved===true||teacher.is_approved===true}}catch(_){}if(!approved){await sb.auth.signOut();throw new Error('This account is not approved as a teacher. Please contact school administration.')}message.className='auth-message success';message.textContent='Teacher verified. Opening portal…';setTimeout(()=>location.href='./teacher.html',400)}catch(err){message.className='auth-message error';message.textContent=err.message||'Unable to sign in.';button.disabled=false}}</script></body></html>
